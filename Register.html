<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>

<body>

<header class="hotel-header text-white">
    <div class="container py-3 text-center">
        <h1 class="h2 mb-0"><u>Hotel Registration</u></h1>
    </div>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <form class="card shadow-sm p-4">

                <label for="fname" class="form-label">Full Name</label>
                <input type="text" id="fname" class="form-control mb-3" placeholder="Enter full name">

                <label for="email" class="form-label">Email</label>
                <input id="email" class="form-control mb-3" type="email" placeholder="Enter email">

                <label for="mobile" class="form-label">Mobile Number</label>
                <input id="mobile" class="form-control mb-3" type="tel" placeholder="Enter contact number">

                <label for="address" class="form-label">Address</label>
                <input id="address" class="form-control mb-3" type="text" placeholder="Enter address">

                <label class="form-label">Gender</label>
                <div class="mb-3">
                    <div class="form-check form-check-inline">
                        <input type="radio" id="male" name="gender" value="Male" class="form-check-input">
                        <label for="male" class="form-check-label">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="radio" id="female" name="gender" value="Female" class="form-check-input">
                        <label for="female" class="form-check-label">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="radio" id="other" name="gender" value="Other" class="form-check-input">
                        <label for="other" class="form-check-label">Other</label>
                    </div>
                </div>

                <label for="dob" class="form-label">Date of Birth</label>
                <input id="dob" class="form-control mb-3" type="date">

                <label for="pass" class="form-label">Password</label>
                <input type="password" id="pass" class="form-control mb-3" placeholder="Password">

                <label for="pass1" class="form-label">Confirm Password</label>
                <input type="password" id="pass1" class="form-control mb-3" placeholder="Confirm Password">

                <div class="d-flex gap-2">
                    <input class="btn btn-primary" type="submit" value="Register">
                    <input class="btn btn-secondary" type="reset">
                </div>
            </form>
        </div>
    </div>
</main>

<footer class="mt-5">
    <div class="container py-4 text-center">
        <p class="mb-2">Room Service: +91 98765 43210 | Reception: +91 98765 43211 | Email: luxurystay@gmail.com</p>
        <p class="mb-0">© 2026 Luxury Stay Hotel. All Rights Reserved.</p>
    </div>
</footer>

</body>
</html>
