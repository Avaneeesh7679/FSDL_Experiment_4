<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>

<body>

<header class="hotel-header text-white">
    <div class="container py-3 text-center">
        <h1 class="h2 mb-0">Hotel Login</h1>
    </div>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-5">
            <form class="card shadow-sm p-4">
                <label for="email" class="form-label">Email</label>
                <input id="email" class="form-control mb-3" type="email" placeholder="Enter Email">

                <label for="password" class="form-label">Password</label>
                <input id="password" class="form-control mb-3" type="password" placeholder="Enter Password">

                <div class="d-flex gap-2">
                    <input class="btn btn-primary" type="submit" value="Login">
                    <input class="btn btn-secondary" type="reset">
                </div>
            </form>

            <p class="text-center mt-3">
                Don't have an account?
                <a href="Register.html">Register Here</a>
            </p>
        </div>
    </div>
</main>

<footer class="mt-5">
    <div class="container py-4 text-center">
        <p class="mb-2">Room Service: +91 98765 43210 | Reception: +91 98765 43211 | Email: luxurystay@gmail.com</p>
        <p class="mb-0">© 2026 Luxury Stay Hotel. All Rights Reserved.</p>
    </div>
</footer>

</body>
</html>
